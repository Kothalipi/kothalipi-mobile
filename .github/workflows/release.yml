name: "Mobile Release"

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Tag Name
        id: get-tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "refs/heads/main" ]; then
            TAG="v0.2.0"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get-tag.outputs.tag }}"
          gh release create "$TAG" \
            --title "Kothalipi Mobile $TAG (Android APK & iOS IPA)" \
            --notes "### Kothalipi Mobile $TAG
            - **Fixed Gemini API Engine:** Updated to Gemini 2.5 Flash / 2.5 Flash Lite / 2.0 Flash with smart fallback and API key validation.
            - **Fixed Android Floating Bubble:** Proper Foreground Microphone Service for Android 14+ with optional Accessibility auto-type.
            - **Upgraded Voice Keyboard (Android & iOS):** 4 modes (Bangla, English, Bangla->EN, Auto), punctuation bar, and real voice dictation on iOS.
            - **New UI & History:** Voice-reactive waveform, writing styles (Normal/Formal/Casual/Bullets), and searchable dictation history." \
            --draft=false \
            --prerelease=false || echo "Release already exists"

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Core with cargo-ndk
        run: |
          cd core
          cargo test
          cargo build --release --bin uniffi-bindgen
          cargo ndk -t arm64-v8a -t x86_64 -o ../android/app/src/main/jniLibs build --release

          cargo run --release --bin uniffi-bindgen generate \
            --library ../android/app/src/main/jniLibs/arm64-v8a/libkothalipi_core.so \
            --language kotlin \
            --out-dir ../android/app/src/main/java

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build Android APK
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          cd android
          gradle assembleDebug --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/Kothalipi-${TAG}.apk"

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release upload "$TAG" "dist/Kothalipi-${TAG}.apk" --clobber

  build-ios:
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate & Build iOS App
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          cd ios
          xcodegen generate
          xcodebuild -project Kothalipi.xcodeproj \
            -scheme Kothalipi \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          mkdir -p ../dist/Payload
          cp -r build/Build/Products/Release-iphoneos/Kothalipi.app ../dist/Payload/
          cd ../dist
          zip -r "Kothalipi-${TAG}.ipa" Payload

      - name: Upload IPA to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release upload "$TAG" "dist/Kothalipi-${TAG}.ipa" --clobber
