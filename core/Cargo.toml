[package]
name = "kothalipi_core"
version = "0.1.0"
edition = "2021"
authors = ["TA Shanto"]
license = "MIT"
description = "Kothalipi shared mobile core library for Android and iOS"

[lib]
name = "kothalipi_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
uniffi = { version = "0.28", features = ["cli", "tokio"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
thiserror = "1.0"
log = "0.4"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
